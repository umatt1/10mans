name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["data/stats.json", "data/matches.json"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
