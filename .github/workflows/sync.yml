name: Sync stats
on:
  push:
    branches: [main]
    paths: ["data/matches/**", "data/aliases.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_matches.py
      - run: python3 scripts/sync.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json data/matches.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
